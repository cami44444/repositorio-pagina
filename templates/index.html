<center> <h1>Inicio de sesion con python cami</h1> </center>


  <form action="/add" method="POST" clas="mb-4">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Ingrese su nombre</label>
    <input type="text" class="form-control" name="name"placeholder="Ingrese su nombre" required>
   
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Correo electronico</label>
    <input type="email" class="form-control" name="email"placeholder="Ingrese su correo">
  </div>
  
  <button type="submit" class="btn btn-primary">Registrarse</button>
</form>

</center>
<h1>BUSQUEDA DE REGISTRO</h1>
<form action="/search" method="GET" class="d-flex">
    <input type="text" class="form-control me-2" name="q" placeholder="Buscar. . ." value="{{ busqueda or '' }}">
    <button class="btn btn-outline-success" type="submit">Buscar</button>
</form>


<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Correo</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for u in user %}
    <tr>
      <th scope="row">{{ u[0] }}</th>
      <td>{{ u[1] }}</td>
      <td>{{ u[2] }}</td>
      <td>
       <a href="/edit/{{ u[0] }}" class="btn btn-success">Editar</a>
       <a href="/delete/{{ u[0] }}" class="btn btn-warning" onclick="return confirm('¿Estas seguro de que quieres eliminar este registro?');">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
